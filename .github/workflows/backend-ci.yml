name: Backend CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:
  backend-tests:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multi_agent_operations

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d multi_agent_operations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    defaults:
      run:
        working-directory: backend


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Set database environment variable
        run: |
          echo "DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/multi_agent_operations" >> "$GITHUB_ENV"


      - name: Run tests
        run: |
          pytest -v